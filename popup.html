<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Why Did You Click?</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="header">
    <div class="header-title">
      <span class="header-icon">🤔</span>
      <h1>Why Did You Click?</h1>
    </div>
    <div class="header-actions">
      <span id="entry-count" class="entry-count" title="Saved entries"></span>
      <button id="btn-clear-all" class="icon-btn" title="Clear all">🗑</button>
    </div>
  </div>

  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search reasons or titles…" autocomplete="off">
    <button id="btn-clear-search" class="clear-search" title="Clear search" hidden>✕</button>
  </div>

  <div id="entries-list"></div>

  <script src="popup.js"></script>
</body>
</html>
