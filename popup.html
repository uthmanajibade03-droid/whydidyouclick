<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inspiration Board</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span class="header-icon">💡</span>
      <div>
        <h1>Inspiration Board</h1>
        <p class="header-sub">Your saved YouTube references</p>
      </div>
    </div>
    <button id="btn-clear-all" class="icon-btn" title="Clear all">🗑</button>
  </div>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab active" data-filter="all">All <span class="tab-count" id="count-all"></span></button>
      <button class="tab" data-filter="thumbnail">Thumbnails <span class="tab-count" id="count-thumbnail"></span></button>
      <button class="tab" data-filter="title">Titles <span class="tab-count" id="count-title"></span></button>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="Search…" autocomplete="off">
    </div>
  </div>

  <div id="board"></div>

  <script src="popup.js"></script>
</body>
</html>
